# ideology 组生产线配置（由 tools/import_lines.py 反推，人工核对后使用）

[[production_line]]
id = "democracy"
group = "ideology"
name_chinese = "民主支持率"
name_english = "Democratic Support"
name_russian = "Поддержка демократии"
country_flag = "mp_tab_ideology"
resources = { aluminium = 1 }
archetype_equipment = "democracy_in_warehouse"
texture_file = "gfx/interface/ideologies/democratic_group.dds"

[[production_line.equipment]]
id = "democracy_in_warehouse_product"
year = 1936
build_cost = 20
description_chinese = "人造民主支持率！"
description_english = "Artificial democratic support!"
description_russian = "Искусственная поддержка демократии!"

[production_line.technology]
identifiers = [
  "democracy_production_research",
]
descriptions_chinese = [
  "解锁民主支持率生产。",
]
descriptions_english = [
  "Unlocks Democratic Support Production.",
]
descriptions_russian = [
  "Разблокирует производство поддержки демократии.",
]

[[production_line.effect]]
type = "divide_variable"
by = 1

[[production_line.effect]]
type = "add_popularity"
ideology = "democratic"

