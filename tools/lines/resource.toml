[[production_line]]
id = "coal"
group = "resource"
name_chinese = "煤炭"
name_english = "Coal"
name_russian = "Уголь"
country_flag = "mp_tab_resource"
actions = "manual"
archetype_equipment = "coal_in_warehouse"
texture_file = "gfx/interface/decisions/decision_coal.dds"

[[production_line.equipment]]
id = "coal_in_warehouse_product"
year = 1936
build_cost = 70
description_chinese = "我们发明了一种徒手搓资源的办法！"
description_english = "We have invented a way to generate resources with our bare hands!"
description_russian = "Способ добывать уголь голыми руками!"
resources = { coal = 0.5 }

[[production_line.equipment]]
id = "coal_in_warehouse_product_2"
year = 1938
build_cost = 50
description_chinese = "更高效率的徒手搓资源办法！"
description_english = "A more efficient way to generate resources with our bare hands!"
description_russian = "Более эффективный способ добывать уголь голыми руками!"
resources = { coal = 1 }

[[production_line.equipment]]
id = "coal_in_warehouse_product_3"
year = 1941
build_cost = 20
description_chinese = "最高效率的徒手搓资源办法！"
description_english = "The most efficient way to generate resources with our bare hands!"
description_russian = "Самый эффективный способ добывать уголь голыми руками!"
